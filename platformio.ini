; PlatformIO Project Configuration File
;
; CYD LED Matrix Retro Clock (ESP32-2432S028 default)
; Framework: Arduino
;
; NOTE: TFT_eSPI is configured via include/User_Setup.h (see build_flags)
;
[env:cyd_esp32_2432s028]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  tzapu/WiFiManager @ ^2.0.16-rc.2
  bblanchon/ArduinoJson @ ^7.0.4
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  adafruit/Adafruit BME280 Library @ ^2.2.4
  adafruit/Adafruit SHT31 Library @ ^2.2.2
  adafruit/Adafruit HTU21DF Library @ ^1.1.0

; Standard CYD dual-OTA table (frozen - see partitions_custom.csv)
board_build.partitions = partitions_custom.csv

; pre: embeds the web UI in data/ into PROGMEM (no LittleFS image)
; post: writes flash_parts.json + firmware-merged.bin for the web installer
extra_scripts =
  pre:tools/embed_web.py
  post:tools/merge_bin.py

; Web installer board picker (cyd-web-installer)
custom_installer_label = CYD 2.8″ – ESP32-2432S028R
custom_installer_hint  = The classic Cheap Yellow Display: 2.8″ 320×240 screen.

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DUSER_SETUP_LOADED
  -include include/User_Setup.h
  -DLED_MATRIX_W=64
  -DLED_MATRIX_H=32

; OTA upload configuration (password must match OTA_PASSWORD in config.h)
; Uncomment the lines below to enable OTA uploads and set your device IP
; upload_protocol = espota
; upload_port = 192.168.1.226  ; Change to your device's IP address
; upload_flags =
;   --auth=change-me  ; Match OTA_PASSWORD in config.h

; If your CYD uses different pins, edit include/User_Setup.h.
; If you use ESP32-2432S024 or another display controller, adjust driver + resolution there too.
